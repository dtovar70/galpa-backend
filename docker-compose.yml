services:
    postgres:
        image: postgres:17
        container_name: galpa-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: galpa
            POSTGRES_USER: galpa
            POSTGRES_PASSWORD: galpa
        ports:
            # Host port 5441 avoids clashing with locally installed Postgres servers (5432/5433)
            # and other projects' containers. Override with POSTGRES_PORT and keep the port in
            # DATABASE_URL in sync.
            - '${POSTGRES_PORT:-5441}:5432'
        volumes:
            - galpa-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U galpa -d galpa']
            interval: 5s
            timeout: 5s
            retries: 10

    # Development inbox: every email sent with MAIL_DRIVER=smtp lands here (nothing reaches real
    # inboxes). Web UI http://localhost:8025, SMTP localhost:1025, no login.
    mailpit:
        image: axllent/mailpit:latest
        container_name: galpa-mailpit
        restart: unless-stopped
        ports:
            - '${MAILPIT_SMTP_PORT:-1025}:1025'
            - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
    galpa-postgres-data:
